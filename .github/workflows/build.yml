name: Compiler l'APK UV Guard

# Se déclenche à chaque envoi sur la branche main, et peut aussi être lancé manuellement
# depuis l'onglet "Actions" du dépôt (bouton "Run workflow").
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17 (requis pour Gradle/Android)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle (le projet n'a pas de wrapper committé)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Compiler l'APK de debug
        run: gradle assembleDebug

      - name: Publier l'APK comme fichier téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: uvguard-debug-apk
          path: app/build/outputs/apk/debug/*.apk
